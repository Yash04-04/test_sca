name: SCA + Secrets Scan

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  sca-secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run SCA + secrets scan
        env:
          BACKEND_API_URL: "https://devapi.xops360.ai"
          BACKEND_API_TOKEN: "xops-sca-_O_5sAcu1gXeKZpDmm6X6GlOWW4DVjKAsYO0JmUCtG4"
        run: |
          docker pull public.ecr.aws/e9l9t5a0/non-prod-sca-secrets-public:latest
          docker run --rm \
            -v "${{ github.workspace }}":/workspace \
            -e BACKEND_API_URL \
            -e BACKEND_API_TOKEN \
            public.ecr.aws/e9l9t5a0/non-prod-sca-secrets-public:latest \
            --input /workspace --scans sca,secrets --fail-on HIGH
